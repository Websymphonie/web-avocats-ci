# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
  trusted_proxies: '127.0.0.1'
  trusted_headers: [ 'X-Forwarded-Proto' ]
  secret: '%env(APP_SECRET)%'
  #csrf_protection: true
  annotations: false
  http_method_override: true
  handle_all_throwables: true
  http_client:
    default_options:
  rate_limiter:
    reset_password_email:
      policy: 'fixed_window'
      limit: 5
      interval: '15 minutes'
    reset_password_ip:
      policy: 'fixed_window'
      limit: 20
      interval: '15 minutes'
    contact_ip:
      policy: 'fixed_window'
      limit: 5
      interval: '15 minutes'

  # Enables session support. Note that the session will ONLY be started if you read or write from it.
  # Remove or comment this section to explicitly disable session support.
  session:
    handler_id: null
    cookie_secure: auto
    cookie_samesite: lax
    cookie_lifetime: 0         # session cookie dure jusqu'à la fermeture du navigateur
    gc_maxlifetime: 300        # 300 secondes = 5 minutes
  
  #esi: true
  #fragments: true
  php_errors:
    log: true

when@prod:
  framework:
    error_controller: Websymphonie\SharedContext\Presenter\Controller\Errors\ErrorController::index

when@test:
  framework:
    test: true
    session:
      storage_factory_id: session.storage.factory.mock_file
