security:
  # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
  role_hierarchy:
    ROLE_AVOCAT:
      - ROLE_USER
    ROLE_ADMIN:
      - ROLE_AVOCAT
    ROLE_SUPER_ADMIN:
      - ROLE_ADMIN
      - ROLE_ALLOWED_TO_SWITCH
  # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
  providers:
    app_user_provider:
      entity:
        class: Websymphonie\IdentityContext\Infrastructure\Persistence\Doctrine\Entity\Users\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    main:
      lazy: true
      provider: app_user_provider
      user_checker: Websymphonie\AuthContext\Presenter\Security\UserChecker
      entry_point: Websymphonie\AuthContext\Presenter\Security\AppAuthenticator
      custom_authenticator:
        - Websymphonie\AuthContext\Presenter\Security\AppAuthenticator
      login_throttling:
        max_attempts: 5
        interval: '15 minutes'
      remember_me:
        secret: '%kernel.secret%'
        name: REMEMBERME
        lifetime: 604800 # 1 week in seconds
        path: /
        samesite: 'lax'
        httponly: true
        secure: true
        always_remember_me: false
        remember_me_parameter: '_remember_me'
        token_provider: 'Symfony\Bridge\Doctrine\Security\RememberMe\DoctrineTokenProvider'
      logout:
        path: app_logout
        enable_csrf: true
        csrf_token_id: logout
        csrf_parameter: _csrf_token
        invalidate_session: true

      access_denied_handler: Websymphonie\AuthContext\Presenter\Security\AccessDeniedHandler
      access_denied_url: app_login

  access_control:
    # Routes publiques explicites
    - { path: ^/$, roles: PUBLIC_ACCESS, requires_channel: '%env(SECURE_SCHEME)%' }
    - { path: ^/auth/login$, roles: PUBLIC_ACCESS, requires_channel: '%env(SECURE_SCHEME)%' }
    - { path: ^/auth/email-request, roles: PUBLIC_ACCESS, requires_channel: '%env(SECURE_SCHEME)%' }
    - { path: ^/auth/password-reset, roles: PUBLIC_ACCESS, requires_channel: '%env(SECURE_SCHEME)%' }
    - { path: ^/auth/user-email-verify$, roles: PUBLIC_ACCESS, requires_channel: '%env(SECURE_SCHEME)%' }
    - { path: ^/auth/account/activate, roles: PUBLIC_ACCESS, requires_channel: '%env(SECURE_SCHEME)%' }
    - { path: ^/(actualites|evenements|videos|galeries|formations|lives|avocats|cabinets)(/|$), roles: PUBLIC_ACCESS, requires_channel: '%env(SECURE_SCHEME)%' }
    - { path: ^/le-barreau$, roles: PUBLIC_ACCESS, requires_channel: '%env(SECURE_SCHEME)%' }
    - { path: ^/le-barreau/[a-z0-9]+(?:-[a-z0-9]+)*$, roles: PUBLIC_ACCESS, requires_channel: '%env(SECURE_SCHEME)%' }
    - { path: ^/carpa(?:/[a-z0-9]+(?:-[a-z0-9]+)*)?$, roles: PUBLIC_ACCESS, requires_channel: '%env(SECURE_SCHEME)%' }
    - { path: ^/informations/[a-z0-9]+(?:-[a-z0-9]+)*$, roles: PUBLIC_ACCESS, requires_channel: '%env(SECURE_SCHEME)%' }
    - { path: ^/recherche/autocomplete$, roles: PUBLIC_ACCESS, requires_channel: '%env(SECURE_SCHEME)%' }
    - { path: ^/documents/[0-9a-fA-F-]+/download$, roles: PUBLIC_ACCESS, requires_channel: '%env(SECURE_SCHEME)%' }
    - { path: ^/webhook/kkiapay$, roles: PUBLIC_ACCESS, requires_channel: '%env(SECURE_SCHEME)%' }

    # Surfaces applicatives
    - { path: ^/espace(/|$), roles: IS_AUTHENTICATED_FULLY, requires_channel: '%env(SECURE_SCHEME)%' }
    - { path: ^/admin(/|$), roles: IS_AUTHENTICATED_FULLY, requires_channel: '%env(SECURE_SCHEME)%' }

    # Les routes non déclarées publiques restent privées par défaut.
    - { path: ^/, roles: IS_AUTHENTICATED_FULLY, requires_channel: '%env(SECURE_SCHEME)%' }

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4 # Lowest possible value for bcrypt
        time_cost: 3 # Lowest possible value for argon
        memory_cost: 10 # Lowest possible value for argon
