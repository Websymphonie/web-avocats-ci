vich_uploader:
  db_driver: orm

  mappings:
    user_photo:
      uri_prefix: /uploads/users
      upload_destination: '%kernel.project_dir%/public/uploads/users'
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
      inject_on_load: false
      delete_on_update: true
      delete_on_remove: true

    logo:
      uri_prefix: /uploads/logo
      upload_destination: '%kernel.project_dir%/public/uploads/logo'
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
      inject_on_load: false
      delete_on_update: true
      delete_on_remove: true

    images:
      uri_prefix: /uploads/images
      upload_destination: '%kernel.project_dir%/public/uploads/images'
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
      inject_on_load: false
      delete_on_update: true
      delete_on_remove: true
